project:
  name: multi-asset-volatility-forecasting
  timezone: exchange-local dates from Yahoo Finance

data:
  source: Yahoo Finance via yfinance
  start_date: "2010-01-01"
  end_date: null
  raw_dir: data/raw
  processed_dir: data/processed
  quality_dir: data/quality
  auto_adjust: false
  allow_close_as_adjusted: false
  target_assets:
    SPY: SPY.csv
    QQQ: QQQ.csv
    IWM: IWM.csv
    TLT: TLT.csv
    GLD: GLD.csv
    USO: USO.csv
  context_assets:
    "^VIX": VIX.csv

walk_forward:
  train_end: "2021-12-31"
  validation_end: "2023-12-31"

dm_test:
  enabled: true
  losses: [qlike, mae]
  primary_loss: qlike
  hac_lag: 4

strategy:
  enabled: true
  target_vol: 0.10
  max_leverage: 1.5
  evaluation_segment: test
  cost_bps: 10.0
  rebalance_every: 5
  forecasting_models:
    - historical_rv_21d
    - ewma_rv
    - har_rv
    - ridge_rv
    - garch_rv

robustness:
  enabled: true
  cost_doubling_bps: 20

calculation:
  annualization_factor: 252
  label_horizon: 5
  baseline_window: 21
  ewma_lambda: 0.94
  ewma_lambdas: [0.90, 0.94, 0.97, 0.99]
  ewma_min_periods: 21
  qlike_epsilon: 1.0e-12
  forecast_variance_floor: 1.0e-4
  extreme_return_threshold: 0.20
  long_gap_days: 7
  garch:
    enabled: true
    p: 1
    q: 1
    min_train_observations: 120
  ridge:
    enabled: true
    penalty: ridge
    feature_columns:
      - har_daily_rv
      - har_weekly_rv
      - har_monthly_rv
      - parkinson_5d
      - parkinson_22d
      - garman_klass_22d
      - rel_return_5d
      - rel_return_21d
      - downside_frac_21d
      - close_to_ma_21d
      - drawdown_21d
      - volume_ratio_21d
      - log_vix
      - vix_change_5d
    variance_floor: 1.0e-4
    min_train_observations: 120
    min_validation_observations: 20
    lambda_grid: [0.0, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
    lasso_lambda_grid: [0.0, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.1]
  har_vix:
    enabled: true
    target: log_variance
    log_floor: 1.0e-12
    smearing: true

outputs:
  predictions: data/processed/baseline_predictions.parquet
  metrics: outputs/tables/baseline_metrics.csv
  walk_forward_metrics: outputs/tables/walk_forward_metrics.csv
  dm_tests: outputs/tables/dm_tests.csv
  ewma_lambda_selection: outputs/tables/ewma_lambda_selection.csv
  har_coefficients: outputs/tables/har_coefficients.csv
  har_vix_coefficients: outputs/tables/har_vix_coefficients.csv
  garch_params: outputs/tables/garch_params.csv
  ridge_params: outputs/tables/ridge_params.csv
  ridge_lambda_selection: outputs/tables/ridge_lambda_selection.csv
  strategy_metrics: outputs/tables/strategy_metrics.csv
  transmission_waterfall: outputs/tables/transmission_waterfall.csv
  portfolio_metrics: outputs/tables/portfolio_metrics.csv
  alt_label_metrics: outputs/tables/alt_label_metrics.csv
  alt_label_dm: outputs/tables/alt_label_dm.csv
  strategy_cost_sensitivity: outputs/tables/strategy_cost_sensitivity.csv
  test_model_comparison: outputs/tables/test_model_comparison.csv
  vix_incremental_comparison: outputs/tables/vix_incremental_comparison.csv
  asset_robustness: outputs/tables/asset_robustness.csv
  regime_robustness: outputs/tables/regime_robustness.csv
  metadata: outputs/tables/run_metadata.json
  figure: outputs/figures/spy_baseline_vs_actual.png
