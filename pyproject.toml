[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-volatility-forecasting"
version = "0.1.0"
description = "Offline-reproducible baseline for multi-asset volatility forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "yfinance>=0.2.40",
  "arch>=7.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
